<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Karolina C Design</title>
  <meta name="description" content="Project detail from Karolina C Design portfolio." />
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body class="project-detail">
  <a href="#main" class="skip">Skip to content</a>

  <div data-include="partials/header.html"></div>

  <main id="main">
    <article class="project" data-project hidden>
      <div class="project-layout">
        <aside class="project-aside">
          <div class="project-intro">
            <h1 class="project-title" data-field="title">Project</h1>
            <p class="project-meta" data-field="meta"></p>
          </div>

          <div class="project-info">
            <div class="project-info-block" data-block="goal" hidden>
              <h2 class="project-label">Goal</h2>
              <div class="project-info-body" data-field="goal"></div>
            </div>

            <div class="project-info-block" data-block="year" hidden>
              <h2 class="project-label">Year</h2>
              <p class="project-info-body" data-field="year"></p>
            </div>

            <dl class="project-details" data-field="details"></dl>
          </div>

          <nav class="project-nav" data-block="nav" aria-label="Project navigation" hidden>
            <a class="project-nav-link project-nav-prev" data-field="prev" rel="prev">
              <span class="project-nav-arrow" aria-hidden="true">←</span>
              <span>Previous project</span>
            </a>
            <a class="project-nav-link project-nav-next" data-field="next" rel="next">
              <span>Next project</span>
              <span class="project-nav-arrow" aria-hidden="true">→</span>
            </a>
          </nav>
        </aside>

        <div class="project-main">
          <div class="project-content" data-field="content"></div>

          <div class="project-links" data-block="links" hidden>
            <h2>Related</h2>
            <div class="project-links-list" data-field="links"></div>
          </div>
        </div>
      </div>
    </article>

    <section class="empty-state" data-empty-state hidden>
      <h2>Projekt nenalezen</h2>
      <p>Vybraný projekt jsme nenašli. Zkuste se vrátit <a href="./index.html#work">zpět na práci</a>.</p>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>
  <script src="https://unpkg.com/aos@next/dist/aos.js" defer></script>
  <script src="./vendor/marked.min.js" defer></script>
  <script src="./partials.js" defer></script>
  <script src="./project-detail.js" defer></script>
</body>
</html>
